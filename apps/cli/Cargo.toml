[package]
name = "ariadne-cli"
description = "CLI and server executable for Ariadne"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ariadne"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ariadne-config = { path = "../../crates/ariadne-config" }
ariadne-core = { path = "../../crates/ariadne-core" }
ariadne-provider-openai = { path = "../../crates/ariadne-provider-openai" }
ariadne-server = { path = "../../crates/ariadne-server" }
ariadne-tools-command = { path = "../../crates/ariadne-tools-command" }
ariadne-tools-filesystem = { path = "../../crates/ariadne-tools-filesystem" }
axum.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
futures-util.workspace = true
ratatui.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
