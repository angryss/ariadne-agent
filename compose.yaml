services:
  rynna:
    build:
      context: .
    image: rynna:local
    restart: unless-stopped
    ports:
      - "${RYNNA_HOST_BIND:-127.0.0.1}:3000:3000"
    environment:
      RYNNA_API_BASE: "${RYNNA_API_BASE:-http://host.docker.internal:11434/v1}"
      RYNNA_MODEL: "${RYNNA_MODEL:-qwen3:8b}"
      RYNNA_API_KEY: "${RYNNA_API_KEY:-}"
      RYNNA_SYSTEM_PROMPT: "${RYNNA_SYSTEM_PROMPT:-You are Rynna, a careful and capable AI software agent.}"
      RUST_LOG: "${RUST_LOG:-warn}"
    extra_hosts:
      # Linux host Ollama must listen beyond loopback; see README.md.
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
